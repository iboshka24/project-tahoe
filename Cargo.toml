[workspace]
members = [
    "crates/tahoe-core",
    "crates/tahoe-format",
    "crates/tahoe-uel",
    "crates/tahoe-compat",
    "crates/tahoe-compositor",
    "crates/tahoe-shell",
    "crates/tahoe-diagnostics",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/iboshka24/project-tahoe"
rust-version = "1.87"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"

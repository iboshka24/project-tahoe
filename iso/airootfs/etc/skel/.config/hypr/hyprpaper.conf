# Shipped default wallpaper for the Tahoe live session. MacShell's Liquid
# Glass reads the active hyprpaper image (it also knows wallpaperPath from
# ~/.config/macdock/settings.json, which points at the same file).
#
# Replace freely: the Settings app (or Ctrl+Alt+W wallpaper picker, or the
# Light/Dark pair naming) copy into /home/tahoe/Pictures/Wallpapers.
preload=/home/tahoe/Pictures/Wallpapers/Tahoe-Dark.png
wallpaper=,/home/tahoe/Pictures/Wallpapers/Tahoe-Dark.png

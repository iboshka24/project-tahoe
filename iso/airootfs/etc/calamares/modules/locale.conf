#
# Default location on the timezone map. The user can change it; this only
# chooses the initial pin.
#
# The default language is en_US.UTF-8. The locale module does not pick a
# language itself (the welcome page does); localecfg always enables
# en_US.UTF-8 in /etc/locale.gen and writes it to /etc/locale.conf.
#
# GeoIP is omitted on purpose: this image is installed offline and must not
# depend on a network lookup to guess a timezone.
region: "America"
zone: "New_York"

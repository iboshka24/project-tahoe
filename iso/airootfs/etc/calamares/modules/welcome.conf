---
# SPDX-FileCopyrightText: no
# SPDX-License-Identifier: CC0-1.0
#
# Welcome page for the Tahoe live medium.
#
# The installer is offline: it unpacks the squashfs that is already on the
# medium, so there is deliberately no internet check here. The language is
# chosen on this page; en_US.UTF-8 is what localecfg enables when nothing
# else is chosen.
#
# Only checks the live session can actually satisfy are listed. The test
# conditions from upstream (false, slow-true, snark) are removed: they exist
# to exercise Calamares' own test suite, not an installer.
showSupportUrl:         true
showKnownIssuesUrl:     false   # branding.desc has no knownIssuesUrl
showReleaseNotesUrl:    true
showDonateUrl:          false   # not a KDE product; no donation URL in branding

requirements:
    requiredStorage:    5.5
    requiredRam:        1.0
    check:
        - storage
        - ram
        - power
        - root
        - screen
    required:
        - storage
        - ram

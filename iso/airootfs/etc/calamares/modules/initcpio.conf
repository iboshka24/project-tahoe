# SPDX-FileCopyrightText: no
# SPDX-License-Identifier: CC0-1.0
#
# Run mkinitcpio for the Arch "linux" kernel. /etc/mkinitcpio.d/linux.preset
# is owned by the linux package and writes /boot/initramfs-linux.img, which
# is what the GRUB entries use.
kernel: linux

# Keep the upstream safe default for initramfs permissions.
be_unsafe: false

---
# SPDX-FileCopyrightText: no
# SPDX-License-Identifier: CC0-1.0
#
# Partitioning for a normal Arch install: a single ext4 root partition, plus
# an EFI system partition only when the machine booted through UEFI.
#
# No defaultPartitionTableType is set on purpose. Calamares then uses GPT on
# UEFI and msdos on BIOS, which is what the matching GRUB install needs:
# BIOS + msdos needs no extra bios_grub partition, and UEFI + GPT gets the
# ESP created below. If a user picks GPT on a BIOS machine by hand, they also
# have to add a bios_grub partition themselves.
#
# No partitionLayout is set: Calamares' default is one root partition using
# all remaining space. There is deliberately no separate /home, so the whole
# install is one filesystem.

# The ESP is only created on UEFI installs. 300MiB leaves room for GRUB and
# a second kernel later; 32MiB is the EFI-spec minimum, not a recommendation.
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    300MiB
    minimumSize:        32MiB
    label:              "EFI"

# Swap is off by default (initialSwapChoice below). The other choices stay
# available so a user who wants suspend-to-disk or a swap file can ask for it.
userSwapChoices:
    - none      # Create no swap, use no swap
    - small     # Up to 4GB
    - suspend   # At least main memory size
    - file      # To swap file instead of partition

# Start on "erase disk". This is a deliberate choice for this installer: it
# is the only path the unpackfs strategy is meant to support, and the user
# still has to confirm the disk on the next page. Upstream warns that "none"
# is safer for a general-purpose installer; Tahoe is not one.
initialPartitioningChoice: erase

# No swap unless the user changes it.
initialSwapChoice: none

# ext4 is the only filesystem offered for automatic partitioning.
defaultFileSystemType:  "ext4"

# GRUB cannot unlock LUKS2 with Argon2id. LUKS1 is the compatible default if
# the user turns on encryption on the manual partitioning page.
luksGeneration: luks1

# The live medium itself is mounted from /dev/mapper/live-* by the archiso
# hook. Keep those mappings when the partition module clears stale mounts,
# or the squashfs disappears from under the installer.
essentialMounts: [ "live-*", "control", "ventoy" ]

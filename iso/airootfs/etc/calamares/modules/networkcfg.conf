#
# networkcfg is a Python job with "noconfig: true" in its module.desc. It
# copies the live session's NetworkManager connection profiles (and
# /etc/resolv.conf) into the target, then rewrites the profile permissions
# from the live user to the installed user. That live user is not this
# installer's user, so the copy is best-effort; NetworkManager is enabled by
# services-systemd separately.
#
# There are no keys to set.

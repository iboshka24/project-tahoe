#
# localecfg is a Python job with "noconfig: true" in its module.desc. It reads
# the locales from global storage (set by the locale/welcome pages), enables
# them in the target's /etc/locale.gen, always enables en_US.UTF-8, runs
# locale-gen and writes /etc/locale.conf.
#
# There are no keys to set. The empty mapping keeps the file valid YAML and
# makes the absence of configuration explicit.
{}

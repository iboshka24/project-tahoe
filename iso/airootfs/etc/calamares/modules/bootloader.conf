---
# SPDX-FileCopyrightText: no
# SPDX-License-Identifier: CC0-1.0
#
# GRUB for both firmware types. Calamares looks at the firmware it booted
# under: on UEFI it runs
#   grub-install --target=x86_64-efi --efi-directory=/boot/efi ...
# (the ESP created by partition.conf), and on BIOS it runs
#   grub-install --target=i386-pc /dev/<disk>
# There is no separate "install EFI" switch in Calamares 3.4; this is the
# module's built-in behaviour. installHybridGRUB stays false: a BIOS install
# writes a BIOS bootloader, a UEFI install writes an EFI one.
#
# The Arch kernel is /boot/vmlinuz-linux, a symlink to
# /usr/lib/modules/<version>/vmlinuz. GRUB does not take a kernel path from
# this file: grub-mkconfig scans /boot and writes the "linux /vmlinuz-linux"
# entries itself. kernelSearchPath/kernelPattern are used by the
# systemd-boot/refind code paths only, and are kept for completeness.
#
# NOTE: grub, efibootmgr and dosfstools are listed in iso/packages.x86_64
# under "what the installer needs at run time", so grub-install/grub-mkconfig
# and mkfs.fat are present in the live rootfs. e2fsprogs, which kpmcore only
# lists as an optional dependency, is not in that list; without it mkfs.ext4
# is missing. This is a known gap in the current package list.
efiBootLoader: "grub"

kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"

# systemd-boot only; kept at the same five seconds as GRUB for consistency.
loaderEntries:
  - "timeout 5"
  - "console-mode keep"

kernelParams: [ "quiet" ]

grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

# Copy GRUB to the removable-media fallback path (bootx64.efi) as well.
installEFIFallback: true

# Do not install both firmware variants on every machine.
installHybridGRUB: false

# SPDX-FileCopyrightText: no
# SPDX-License-Identifier: CC0-1.0
#
# Finished page. The restart button is shown but starts unchecked, so a
# successful install does not reboot the machine unless the user asks for it.
# That is upstream's default and is deliberate here: the user may still want
# to read the summary or open a shell first.
restartNowMode: user-unchecked
restartNowCommand: "systemctl -i reboot"

# The live session has no desktop bus that Calamares (running as root) can
# reach, so the notification would never be delivered.
notifyOnFinished: false

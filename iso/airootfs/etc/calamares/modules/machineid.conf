---
# SPDX-FileCopyrightText: no
# SPDX-License-Identifier: CC0-1.0
#
# Regenerate the target's machine identity. This matters more than usual with
# the unpackfs strategy: the squashfs carries the live image's /etc/machine-id,
# and every installed system must get a fresh one.
systemd: true
systemd-style: uuid

# D-Bus reads the same ID through a symlink; this is what Arch's dbus package
# expects.
dbus: true
dbus-symlink: true

# Do not copy the live host's entropy; generate fresh files in the target.
entropy-copy: false
entropy-files:
    - /var/lib/urandom/random-seed
    - /var/lib/systemd/random-seed

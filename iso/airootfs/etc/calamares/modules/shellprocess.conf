# SPDX-License-Identifier: GPL-3.0-or-later
# Remove live-medium state from the system that unpackfs just copied.
#
# The target is the live root, so anything that exists only to make the live
# session work would otherwise be installed as well. Two of those are directly
# dangerous on a real machine: root and `tahoe` have empty password hashes in
# the image's /etc/shadow, and the live sudoers drop-in grants tahoe
# passwordless sudo. The getty drop-in logs that account in on tty1, and
# archiso.conf would make mkinitcpio build an initramfs that expects the live
# medium instead of the installed disk.
#
# Commands run with /bin/sh -c inside the target chroot (dontChroot: false).
# A command starting with "-" is allowed to fail; these all use explicit
# handling instead so a real failure is visible in the install log.
---
dontChroot: false
timeout: 120
verbose: true
script:
    # archiso strips /boot from the live root: the live kernel and initramfs
    # live on the medium, not in the squashfs, so `ls /boot` there is empty.
    # Every installed system needs a kernel, and mkinitcpio's preset names
    # /boot/vmlinuz-linux, so put the package's real kernel file back before
    # the initcpio job runs. A copy, not a symlink: GRUB then reads a plain
    # file rather than depending on its ext4 symlink support.
    - "cp /usr/lib/modules/*/vmlinuz /boot/vmlinuz-linux"
    - "test -r /boot/vmlinuz-linux"
    - "passwd -l root"
    - "userdel -r tahoe 2>/dev/null || true"
    - "rm -f /etc/sudoers.d/10-tahoe-live"
    - "rm -f /etc/mkinitcpio.conf.d/archiso.conf"
    - "rm -f /etc/systemd/system/getty@tty1.service.d/autologin.conf"
    - "test ! -e /etc/sudoers.d/10-tahoe-live"
    - "test ! -e /etc/mkinitcpio.conf.d/archiso.conf"
    - "test ! -e /etc/systemd/system/getty@tty1.service.d/autologin.conf"

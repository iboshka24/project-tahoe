---
# SPDX-FileCopyrightText: no
# SPDX-License-Identifier: CC0-1.0
#
# One normal user account, with a password chosen on this page, and sudo
# through Arch's "wheel" group.
#
# The groups below all exist in a base Arch install. "nopasswdlogin" and
# "autologin" (from the upstream sample) are not Arch groups and are not
# created here: there is no display manager to use them.
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - lp
    - video
    - network
    - storage
    - audio
    - name: wheel
      must_exist: true
      system: true

# Creates /etc/sudoers.d/10-installer for the wheel group.
sudoersGroup: wheel
sudoersConfigureWithGroup: false

# The root account gets its own password, so recovery does not depend on the
# user account. The user is not forced to reuse their password for root.
setRootPassword: false
doReusePassword: false

# No display manager, so no display-manager autologin is configured here. The
# tty1 autostart is /etc/skel/.bash_profile plus the live image's getty@tty1
# drop-in (see displaymanager.conf). autologinGroup is required by the users
# schema; it is only used when doAutologin is true, which it is not.
autologinGroup: autologin
displayAutologin: false
doAutologin: false

# A password is required (minLength 1), but no complexity rules beyond that.
# allowWeakPasswords stays false, matching the upstream sample.
passwordRequirements:
    minLength: 1
    maxLength: -1
    libpwquality:
        - minlen=0
        - minclass=0
allowWeakPasswords: false
allowWeakPasswordsDefault: false

user:
    shell: /bin/bash
    forbidden_names: [ root ]
    home_permissions: "o700"

hostname:
    location: EtcFile
    writeHostsFile: true
    # Upstream's template is "derp-${cpu}"; use the product name.
    template: "tahoe-${cpu}"
    forbidden_names: [ localhost ]

presets:
    fullName:
        editable: true
    loginName:
        editable: true

# SPDX-FileCopyrightText: no
# SPDX-License-Identifier: CC0-1.0
#
# Writes /etc/fstab (and /etc/crypttab) from the partitions the user created.
# The default unpackfs install has one ext4 root and, on UEFI, a vfat ESP at
# /boot/efi; both are ordinary entries.
crypttabOptions: luks

# /tmp stays on the root filesystem by default. On an SSD the module may
# mount it as tmpfs, which is the upstream behaviour and is safe here.
tmpOptions:
    default:
        tmpfs: false
        options: ""
    ssd:
        tmpfs: true
        options: "defaults,noatime,mode=1777"

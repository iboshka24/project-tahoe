---
# SPDX-FileCopyrightText: no
# SPDX-License-Identifier: CC0-1.0
#
# The initial layout comes from the live system's vconsole/X11 settings,
# which archiso leaves at "us". The user can change it on the keyboard page.
#
# Arch's kbd package does not ship the pre-converted X11->kbd keymaps that
# this setting looks for, so the path is empty. Calamares then falls back to
# the layout name for /etc/vconsole.conf (KEYMAP=us).
#
# /etc/default/keyboard is a Debian convention and is not used on Arch.
xOrgConfFileName: "/etc/X11/xorg.conf.d/00-keyboard.conf"
convertedKeymapPath: ""
writeEtcDefaultKeyboard: false

# Hyprland keeps its own keyboard configuration in the user's hyprland.conf;
# this module only writes the system-wide console/X11/localed settings.
configure:
    kwin: false

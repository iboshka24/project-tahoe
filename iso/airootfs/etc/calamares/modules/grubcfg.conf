---
# SPDX-FileCopyrightText: no
# SPDX-License-Identifier: CC0-1.0
#
# Write /etc/default/grub in the target. grub is in iso/packages.x86_64, so
# the live rootfs (and therefore the unpacked target) already has the Arch
# package's /etc/default/grub. overwrite stays false: that keeps Arch's other
# settings such as GRUB_PRELOAD_MODULES and the graphics mode. The defaults
# below are still applied on top with always_use_defaults, so GRUB_TIMEOUT is
# explicitly 5 and the menu behaviour does not depend on the package's file.
#
# GRUB_TIMEOUT is the five-second menu the bootloader module then turns into
# /boot/grub/grub.cfg with grub-mkconfig. The bootloader module's own
# loaderEntries timeout only applies to systemd-boot, which Tahoe does not
# use.
overwrite: false
prefer_grub_d: false
keep_distributor: false

kernel_params: [ "quiet" ]

defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: "saved"
    GRUB_DISABLE_SUBMENU: true
    GRUB_TERMINAL_OUTPUT: "console"
    GRUB_DISABLE_RECOVERY: true

always_use_defaults: true

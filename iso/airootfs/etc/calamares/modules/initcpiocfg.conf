# SPDX-FileCopyrightText: no
# SPDX-License-Identifier: CC0-1.0
#
# Arch's mkinitcpio. The module reads the live image's stock
# /etc/mkinitcpio.conf, replaces HOOKS/MODULES/BINARIES/FILES and writes the
# result into the target; initcpio then runs the "linux" preset.
#
# useSystemdHook: true generates the systemd-based hook set Arch ships
# (systemd, autodetect, microcode, kms, modconf, block, keyboard,
# sd-vconsole, filesystems, fsck). No extra hooks are added or removed.
#
# NOTE: the live image also carries /etc/mkinitcpio.conf.d/archiso.conf
# (the archiso boot hooks). unpackfs copies that file into the target, where
# mkinitcpio sources it *after* /etc/mkinitcpio.conf and overrides HOOKS.
# That file must be removed from the installed system by some other means;
# this module cannot delete it.
useSystemdHook: true

hooks:
    prepend: []
    append: []
    remove: []

source: "/etc/mkinitcpio.conf"

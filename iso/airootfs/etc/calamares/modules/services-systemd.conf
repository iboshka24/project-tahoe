# SPDX-FileCopyrightText: no
# SPDX-License-Identifier: CC0-1.0
#
# Units enabled in the installed system. Each one is owned by a package in
# iso/packages.x86_64:
#
#   NetworkManager.service  networkmanager
#   bluetooth.service       bluez
#   fstrim.timer            util-linux (part of base)
#
# NetworkManager is mandatory: without it the installed machine has no
# network. The other two are optional, so a missing unit does not fail an
# install. Do not add units that no package in the list ships.
units:
    - name: "NetworkManager.service"
      action: "enable"
      mandatory: true

    - name: "bluetooth.service"
      action: "enable"
      mandatory: false

    - name: "fstrim.timer"
      action: "enable"
      mandatory: false

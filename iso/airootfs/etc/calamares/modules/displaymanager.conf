#
# Tahoe has NO display manager. Hyprland is started from the shell profile in
# /etc/skel/.bash_profile, reached through the getty@tty1 autologin drop-in
# that the live rootfs ships. (That drop-in hard-codes the live user "tahoe",
# and unpackfs copies it into the target; it is therefore not tied to the
# account the users module creates. This is a known gap in the unpackfs
# strategy.) A DM is not the mechanism here, and none is in
# iso/packages.x86_64.
#
# The module refuses to run with an empty displaymanagers list, so the list
# below is non-empty. Since none of those packages is installed, the module
# logs "selected but not installed" for each and returns without changing
# anything. basicSetup is explicitly false so it cannot create DM users or
# groups even if a DM is ever pulled in by something else.
displaymanagers:
  - sddm
  - lightdm
  - gdm
  - greetd

basicSetup: false
sysconfigSetup: false

# Unpack the live squashfs onto the target instead of pacstrap-ing 500
# packages: the live rootfs already contains exactly the system we ship,
# including the [tahoe] packages, so unpacking it is the same code path that
# was tested by booting and nothing can drift between "live" and "installed".
#
# The medium is mounted by the archiso hook at /run/archiso/bootmnt; the same
# path the live session uses. An empty destination means "the target root".
---
unpack:
    -   source: "/run/archiso/bootmnt/tahoe/x86_64/airootfs.sfs"
        sourcefs: "squashfs"
        destination: ""

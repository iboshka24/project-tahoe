# SPDX-License-Identifier: GPL-3.0-or-later
# Unpack the live squashfs onto the target instead of pacstrap-ing 500
# packages: the live rootfs already contains exactly the system we ship,
# including the [tahoe] packages, so unpacking it is the same code path that
# was tested by booting and nothing can drift between "live" and "installed".
#
# The medium is mounted by the archiso hook at /run/archiso/bootmnt; the same
# path the live session uses. An empty destination means "the target root".
---
unpack:
    -   source: "/run/archiso/bootmnt/tahoe/x86_64/airootfs.sfs"
        sourcefs: "squashfs"
        destination: ""
        # rsync patterns (not regexes), anchored at the image root. These are
        # live-medium state: the live account has an empty password, its
        # sudoers drop-in grants NOPASSWD, the getty drop-in logs it in
        # automatically, and archiso.conf replaces the installed initramfs
        # HOOKS with the ones that expect the live medium. The shellprocess
        # job below removes the same files again as a second line of defence.
        exclude:
            - "/etc/sudoers.d/10-tahoe-live"
            - "/etc/mkinitcpio.conf.d/archiso.conf"
            - "/etc/systemd/system/getty@tty1.service.d/autologin.conf"
            - "/home/tahoe/"

# SPDX-License-Identifier: GPL-3.0-or-later
# Tahoe installer — Calamares, configured for an archiso live medium.
#
# STATUS: **the UI path is configured; the install path is NOT yet proven.**
# The module sequence below is the standard "unpack the live squashfs" install
# that archiso-based distributions use, and it is written from the modules'
# documented behaviour, not from a successful run. Nothing here has formatted
# a disk yet. Do not install to hardware until docs/iso-installer.md says a
# whole install has been done in a VM and the result booted.
---
modules-search: [ local, /usr/lib/calamares/modules ]

# No *instances* block on purpose. An instance must carry both `module:` and
# `id:` (InstanceDescription::fromSettings reads both); with only `id:` the
# module name is empty, the descriptor is invalid, Settings::isValid() returns
# false, and Calamares exits with "Calamares has invalid settings" before it
# draws anything. A module named in the sequence already reads
# /etc/calamares/modules/<module>.conf, so no instance was needed at all.
sequence:
    # Questions that need no privileges.
    - show:
        - welcome
        - locale
        - keyboard
        - partition
        - users
        - summary

    # The work. Order matters: unpack and fstab before the bootloader, and
    # umount last or the bootloader writes to a filesystem still in use.
    - exec:
        - partition
        - mount
        - unpackfs
        # unpackfs copies the live root; this strips the parts of it that are
        # only true on the live medium (see shellprocess.conf).
        - shellprocess
        - machineid
        - fstab
        - locale
        - keyboard
        - localecfg
        - users
        - displaymanager
        - networkcfg
        - hwclock
        - services-systemd
        - initcpiocfg
        - initcpio
        - grubcfg
        - bootloader
        - umount

    - show:
        - finished

branding: tahoe

# Keep the log where a bug report can find it; there is no root password on
# the live image, so a failure immediately after this stage is diagnosable.
log:
    - level: "warning"
    - file: /root/.cache/calamares-install.log

DEFAULT tahoe
LABEL tahoe
MENU LABEL Boot Tahoe Live
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% systemd.firstboot=no %KERNEL_PARAMS%

# The kernel command line uses `archisolabel`, which is the parameter the
# archiso hook actually reads (see its run_hook: archisolabel, archisodevice,
# archisobasedir, archisosearchuuid, ...). `img_label` belongs to the
# archiso_loop_mnt hook, which boots from an ISO *file* and additionally
# requires img_loop=; on its own it is silently ignored, archisodevice ends up
# empty, and the initramfs drops to "ERROR: '' device did not show up".
# Verified by booting the built ISO in QEMU — see docs/iso-boot.md.
#
# `systemd.firstboot=no` suppresses the first-boot prompt. mkarchiso writes
# /etc/machine-id = "uninitialized" on purpose, so systemd runs
# systemd-firstboot --prompt on the first boot of the live image; on a live
# medium whose whole point is to land in a desktop, that prompt is a wall.

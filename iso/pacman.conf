# SPDX-License-Identifier: GPL-3.0-or-later
# Minimal pacman.conf for the Tahoe archiso profile.
#
# [tahoe] is the first-party repository built from packages/ by iso/build.sh
# and published signed; until that sign key exists, package signatures there
# are Optional on purpose (core/extra stay Required as usual). The Alternative
# Server line below is what iso/build.sh rewrites to file:// at build time.
[options]
Architecture = x86_64
CheckSpace
ParallelDownloads = 5
SigLevel = Required DatabaseOptional

[tahoe]
SigLevel = Optional DatabaseOptional
Server = https://repo.tahoe.local/$arch

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

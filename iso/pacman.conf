# Minimal pacman.conf for the Tahoe archiso profile. Replace the placeholder
# [tahoe] server with the real signed repository before building.
[options]
Architecture = x86_64
CheckSpace
ParallelDownloads = 5
SigLevel = Required DatabaseOptional

[tahoe]
SigLevel = Required
Server = https://repo.tahoe.local/$arch

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

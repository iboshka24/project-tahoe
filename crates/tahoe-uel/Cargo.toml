[package]
name = "tahoe-uel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Universal Execution Layer: identify, decide, and supervise (never guess)"

[[bin]]
name = "tahoe-uel"
path = "src/main.rs"

[dependencies]
tahoe-core = { path = "../tahoe-core" }
tahoe-format = { path = "../tahoe-format" }
# Only for `kill_process_group`: a timeout that leaves the child's own
# children running is not a timeout. Already in the build graph via Smithay.
rustix = { version = "0.38", features = ["process"] }

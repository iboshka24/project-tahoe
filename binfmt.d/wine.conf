# Start the Tahoe dispatcher on Windows executables.
#
# This used to point at the wine binary, which the image does not install, so
# systemd-binfmt failed at every boot with:
#
#   /usr/lib/binfmt.d/tahoe-wine.conf:2: Failed to add binary format
#   'DOSWin': No such file or directory
#
# The dispatcher is the right interpreter anyway: it identifies the file with
# the real parser, then chooses Wine or Proton and execs it. Registering Wine
# directly would bake that choice into a kernel rule.
:tahoe-wine-pe:M::MZ::/usr/lib/tahoe/tahoe-dispatch:P
